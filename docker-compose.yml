services:
  # Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # El Monolito (v1): Django + Gunicorn, aislado del exterior
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # Sin 'ports': Django esta aislado, solo Nginx le habla.

  # El Microservicio (v2): Flask - EL ESTRANGULADOR
  pagos_flask:
    build: ./microservicio_pagos
    # Sin 'ports': aislado, solo accesible a traves de Nginx (puerto 80).

  # Proxy Inverso: unico que da la cara a internet
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - pagos_flask

volumes:
  postgres_data:

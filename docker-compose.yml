services:
  # Servicio de Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de tu API Django (ahora con Gunicorn, aislado del exterior)
  web:
    build: .
    # CAMBIO 1: Migra, siembra datos y arranca con Gunicorn (servidor de produccion).
    # 'Tienda' es la carpeta donde esta wsgi.py en este proyecto.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # NOTA: Ya no hay seccion 'ports' aqui. Django esta aislado:
    # solo Nginx puede hablar con el por la red interna de Docker.

  # CAMBIO 2: Agregamos el servicio Nginx (Proxy Inverso)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"  # Nginx es el unico que da la cara a internet
    volumes:
      # Inyectamos nuestro archivo de configuracion en el contenedor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

# Definición del volumen persistente
volumes:
  postgres_data:

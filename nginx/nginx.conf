# nginx/nginx.conf

# Backend v1: el monolito Django + Gunicorn
upstream django_v1 {
    server web:8000;
}

# Backend v2: el microservicio Flask (el "estrangulador")
upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    # Ignorar logs de favicon para no saturar el servidor
    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA NUEVA (v2): Estrangulamos la compra y la mandamos a Flask.
    # Debe ir ANTES de /api/v1 y de / para que tome prioridad.
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # RUTA VIEJA (v1): Sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # El resto del trafico sigue yendo al monolito Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
